appId: com.insidethecomputer.app
productName: Inside the Computer
directories:
  output: release
files:
  - dist/**/*
  - electron/main.cjs
  - electron/preload.cjs
  - package.json
linux:
  target:
    - AppImage
    - deb
  category: Education
  maintainer: "Inside the Computer Team"
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
